<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found</title>
  <style>
    body { background: #181a1b; color: #fff; font-family: 'Inter', Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .container { background: #23272a; padding: 2rem 3rem; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.4); text-align: center; }
    h1 { color: #ff6f61; font-size: 2.5rem; margin-bottom: 1rem; }
    p { color: #7ec8e3; font-size: 1.2rem; }
    a { color: #7ec8e3; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404 – Page Not Found</h1>
    <p>Sorry, the page you’re looking for doesn’t exist.<br>
    <a href="/">Return to Home</a></p>
  </div>
</body>
</html>
